name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validation HTML/CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      # Bloquant : règles structurelles actives (.htmlvalidate.json désactive
      # seulement les règles opiniâtres/stylistiques — cf. clement).
      - name: HTML validation
        run: npx --yes html-validate desha-moulin.html
      - name: CSS validation (advisory)
        run: npx --yes stylelint "**/*.css" --config '{"extends":"stylelint-config-standard"}' || true

  docker:
    name: Build image Docker (nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t gotyeah-danse:ci .
