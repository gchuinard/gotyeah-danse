name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validation HTML/CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      # Non bloquant pour l'instant : html-validate (config recommandée)
      # signale des points pré-existants à corriger (un </div> orphelin
      # ~l.206, des & non encodés). On affiche sans bloquer la CI.
      - name: HTML validation (advisory)
        run: npx --yes html-validate desha-moulin.html || true
      - name: CSS validation (advisory)
        run: npx --yes stylelint "**/*.css" --config '{"extends":"stylelint-config-standard"}' || true

  docker:
    name: Build image Docker (nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t gotyeah-danse:ci .
