server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index desha-moulin.html;

    # Ne pas divulguer la version de nginx (pages d'erreur, en-tête Server)
    server_tokens off;

    gzip on;
    gzip_types text/html text/css application/javascript image/png image/jpeg image/svg+xml font/woff2;
    gzip_min_length 1024;

    # --- Sécurité : ne jamais servir les fichiers d'infra / de dev ---
    # Les en-têtes de sécurité (CSP, HSTS, nosniff, Permissions-Policy...) sont posés
    # en amont (NPM / Cloudflare) : on ne les redéfinit PAS ici pour éviter les doublons.

    # Fichiers cachés (.git, .github, .dockerignore, .htmlvalidate.json...) — sauf /.well-known/
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Le code source de la billetterie est déployé séparément (billets.cours-danse-bergerac.fr) :
    # il ne doit jamais être servi sous l'apex.
    location ^~ /billetterie {
        return 404;
    }

    # Fichiers de configuration / build / manifestes qui ne doivent pas être publics
    location ~* \.(ya?ml|conf|toml|lock|ts|mjs|cjs)$ {
        return 404;
    }
    location ~* /(Dockerfile|package(-lock)?\.json|\.htmlvalidate\.json|optimize-images\.js)$ {
        return 404;
    }

    # --- Contenu statique du site ---
    location ~* \.(css|js|png|jpg|jpeg|svg|woff2|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /desha-moulin.html;
    }
}
